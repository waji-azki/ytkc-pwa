<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>同時視聴で記録 | 配信感想メモ</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f0f0f">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="index.html">← 一覧</a>
    <h1>同時視聴で記録</h1>
    <span></span>
  </header>
  <main id="main">
    <div class="empty">読み込み中...</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
  YTKC.registerSW();

  const params = new URLSearchParams(location.search);
  const idParam = params.get('id');
  const rawUrl = params.get('url') || '';
  const rawText = params.get('text') || '';
  const rawTitle = params.get('title') || '';

  let info = null;
  if (idParam) {
    const v = YTKC.getVideo(idParam);
    info = { videoId: idParam, t: v ? v.lastWatchedAt || 0 : 0 };
  } else {
    info = YTKC.extractYoutubeInfo(rawUrl) || YTKC.extractYoutubeInfo(rawText) || YTKC.extractYoutubeInfo(rawTitle);
  }

  const main = document.getElementById('main');

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1400);
  }

  function renderManualFallback() {
    main.innerHTML = `
      <div class="error-box">
        URLからYouTubeの動画リンクを見つけられませんでした。<br>
        下にYouTubeのURLを貼り付けてください。
      </div>
      <div class="add-box">
        <input id="manualUrl" type="text" placeholder="https://www.youtube.com/watch?v=...">
        <button id="manualBtn">読み込む</button>
      </div>
    `;
    document.getElementById('manualBtn').addEventListener('click', () => {
      const v = document.getElementById('manualUrl').value.trim();
      const found = YTKC.extractYoutubeInfo(v);
      if (found) {
        info = found;
        renderMain();
      } else {
        showToast('URLを読み取れませんでした');
      }
    });
  }

  // ---------- 状態 ----------
  let player = null;
  let mode = 'embed'; // 'embed' | 'timer'
  let pollHandle = null;
  let timerRunning = false;
  let timerBaseT = 0;
  let timerStartedAtMs = null;
  let timerFrozenValue = 0;
  let timerDisplayHandle = null;

  function currentEmbedTime() {
    if (player && player.getCurrentTime) {
      try {
        return player.getCurrentTime() || 0;
      } catch (e) {
        return 0;
      }
    }
    return 0;
  }

  function currentTimerValue() {
    if (timerRunning && timerStartedAtMs != null) {
      return timerBaseT + (Date.now() - timerStartedAtMs) / 1000;
    }
    return timerFrozenValue;
  }

  function getCurrentT() {
    return mode === 'embed' ? currentEmbedTime() : currentTimerValue();
  }

  function renderMain() {
    YTKC.ensureVideo(info.videoId);
    const video = YTKC.getVideo(info.videoId);
    const thumb = video.thumbnail || ('https://i.ytimg.com/vi/' + info.videoId + '/mqdefault.jpg');
    const titleText = video.title || info.videoId;

    timerBaseT = info.t || 0;
    timerFrozenValue = info.t || 0;

    main.innerHTML = `
      <div class="card">
        <div class="video-preview">
          <img src="${thumb}" alt="">
          <div class="title">${titleText}</div>
        </div>

        <div class="mode-switch">
          <button id="modeEmbedBtn" class="active">アプリ内で再生</button>
          <button id="modeTimerBtn">外部再生+タイマー</button>
        </div>

        <div id="embedSection">
          <div class="player-wrap"><div id="playerContainer"></div></div>
          <div class="embed-status" id="embedStatus">再生ボタンを押して視聴を始めてください</div>
        </div>

        <div id="timerSection" style="display:none;">
          <div class="timer-display" id="timerDisplay">${YTKC.secondsToInputString(timerFrozenValue)}</div>
          <div class="timer-controls">
            <button id="openYoutubeBtn">▶ YouTubeで開く</button>
            <button class="primary" id="startPauseBtn">計測開始</button>
            <button id="resetBtn">リセット</button>
          </div>
          <div class="time-row">
            補正:
            <button class="stepBtn" id="timeMinus" type="button">-10s</button>
            <span id="timerAdjustLabel">${YTKC.secondsToInputString(timerFrozenValue)}</span>
            <button class="stepBtn" id="timePlus" type="button">+10s</button>
          </div>
        </div>

        <div class="emoji-toggle-row">
          <button id="emojiToggleBtn" type="button">😊 絵文字</button>
        </div>
        <div class="emoji-picker" id="emojiPicker"></div>

        <div class="text-row">
          <input id="textInput" type="text" placeholder="感想を入力してEnter">
          <button id="sendBtn">送信</button>
        </div>

        <button class="link-btn" id="positionOnlyBtn">コメントなしで、ここまで視聴したと記録する</button>
      </div>

      <div id="sessionLogWrap"></div>

      <div class="actions-row">
        <button id="viewLogBtn">この動画のログを見る</button>
      </div>
    `;

    if (!video.title) {
      YTKC.fetchOEmbed(info.videoId).then((meta) => {
        if (meta) {
          YTKC.updateMeta(info.videoId, meta);
          main.querySelector('.video-preview .title').textContent = meta.title || info.videoId;
          if (meta.thumbnail) main.querySelector('.video-preview img').src = meta.thumbnail;
        }
      });
    }

    setupModeSwitch();
    setupEmbedPlayer();
    setupTimer();
    setupEmojiAndInput();
    renderSessionLog();
  }

  // ---------- モード切替 ----------

  function setupModeSwitch() {
    document.getElementById('modeEmbedBtn').addEventListener('click', () => setMode('embed'));
    document.getElementById('modeTimerBtn').addEventListener('click', () => setMode('timer'));
  }

  function setMode(newMode) {
    if (mode === 'embed' && newMode !== 'embed' && player && player.pauseVideo) {
      try { player.pauseVideo(); } catch (e) {}
    }
    mode = newMode;
    document.getElementById('modeEmbedBtn').classList.toggle('active', mode === 'embed');
    document.getElementById('modeTimerBtn').classList.toggle('active', mode === 'timer');
    document.getElementById('embedSection').style.display = mode === 'embed' ? 'block' : 'none';
    document.getElementById('timerSection').style.display = mode === 'timer' ? 'block' : 'none';
  }

  // ---------- 埋め込みプレイヤー(YouTube IFrame API) ----------

  function setupEmbedPlayer() {
    window.onYouTubeIframeAPIReady = createPlayer;
    if (window.YT && window.YT.Player) {
      createPlayer();
    } else if (!document.getElementById('ytIframeApiScript')) {
      const tag = document.createElement('script');
      tag.id = 'ytIframeApiScript';
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }
  }

  function createPlayer() {
    try {
      player = new YT.Player('playerContainer', {
        videoId: info.videoId,
        playerVars: { start: Math.floor(info.t || 0), playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: () => {
            document.getElementById('embedStatus').textContent = '再生ボタンを押して視聴を始めてください(再生位置は自動で記録されます)';
            startEmbedPolling();
          },
          onError: (e) => {
            document.getElementById('embedStatus').textContent =
              'この動画は埋め込み再生できないようです。「外部再生+タイマー」に切り替えます。';
            setMode('timer');
            showToast('埋め込み再生できないため切り替えました');
          },
        },
      });
    } catch (e) {
      document.getElementById('embedStatus').textContent = '埋め込みプレイヤーを読み込めませんでした。「外部再生+タイマー」をお使いください。';
      setMode('timer');
    }
  }

  function startEmbedPolling() {
    if (pollHandle) clearInterval(pollHandle);
    pollHandle = setInterval(() => {
      if (mode !== 'embed') return;
      const t = currentEmbedTime();
      if (t > 0) YTKC.markPosition(info.videoId, t);
    }, 3000);
  }

  // ---------- タイマー(外部再生+手動計測) ----------

  function setupTimer() {
    document.getElementById('startPauseBtn').addEventListener('click', () => {
      const btn = document.getElementById('startPauseBtn');
      if (!timerRunning) {
        timerRunning = true;
        timerStartedAtMs = Date.now();
        timerBaseT = timerFrozenValue;
        btn.textContent = '⏸ 一時停止';
        tickTimerDisplay();
      } else {
        timerRunning = false;
        timerFrozenValue = currentTimerValue();
        btn.textContent = '▶ 再開';
        updateTimerDisplay();
      }
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      timerRunning = false;
      timerFrozenValue = 0;
      timerStartedAtMs = null;
      document.getElementById('startPauseBtn').textContent = '計測開始';
      updateTimerDisplay();
    });
    document.getElementById('openYoutubeBtn').addEventListener('click', () => {
      const url = YTKC.buildWatchUrl(info.videoId, Math.floor(currentTimerValue()));
      window.open(url, '_blank');
    });
    document.getElementById('timeMinus').addEventListener('click', () => adjustTimer(-10));
    document.getElementById('timePlus').addEventListener('click', () => adjustTimer(10));

    updateTimerDisplay();
  }

  function adjustTimer(delta) {
    if (timerRunning) {
      timerBaseT = Math.max(0, currentTimerValue() + delta);
      timerStartedAtMs = Date.now();
    } else {
      timerFrozenValue = Math.max(0, timerFrozenValue + delta);
    }
    updateTimerDisplay();
  }

  function tickTimerDisplay() {
    if (timerDisplayHandle) clearInterval(timerDisplayHandle);
    timerDisplayHandle = setInterval(() => {
      updateTimerDisplay();
      if (timerRunning) YTKC.markPosition(info.videoId, currentTimerValue());
    }, 1000);
  }

  function updateTimerDisplay() {
    const el1 = document.getElementById('timerDisplay');
    const el2 = document.getElementById('timerAdjustLabel');
    const text = YTKC.formatTime(currentTimerValue());
    if (el1) el1.textContent = text;
    if (el2) el2.textContent = text;
  }

  // ---------- 絵文字ピッカー・入力 ----------

  function setupEmojiAndInput() {
    const emojiPicker = document.getElementById('emojiPicker');
    const emojiToggleBtn = document.getElementById('emojiToggleBtn');
    const textInput = document.getElementById('textInput');

    function insertAtCursor(input, text) {
      const start = input.selectionStart != null ? input.selectionStart : input.value.length;
      const end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
      input.value = input.value.slice(0, start) + text + input.value.slice(end);
      const pos = start + text.length;
      input.focus();
      input.setSelectionRange(pos, pos);
    }

    YTKC.EMOJIS.forEach((em) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = em;
      b.addEventListener('click', () => insertAtCursor(textInput, em));
      emojiPicker.appendChild(b);
    });

    emojiToggleBtn.addEventListener('click', () => {
      const willShow = !emojiPicker.classList.contains('show');
      emojiPicker.classList.toggle('show', willShow);
      emojiToggleBtn.classList.toggle('active', willShow);
      if (willShow) textInput.focus();
    });

    function submit() {
      const text = textInput.value.trim();
      if (!text) return;
      YTKC.addEntry(info.videoId, { t: getCurrentT(), type: 'text', content: text });
      textInput.value = '';
      emojiPicker.classList.remove('show');
      emojiToggleBtn.classList.remove('active');
      showToast('追加しました');
      renderSessionLog();
    }

    document.getElementById('sendBtn').addEventListener('click', submit);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
    });
    document.getElementById('positionOnlyBtn').addEventListener('click', () => {
      YTKC.markPosition(info.videoId, getCurrentT());
      showToast('視聴位置を記録しました');
      renderSessionLog();
    });
    document.getElementById('viewLogBtn').addEventListener('click', () => {
      location.href = 'video.html?id=' + encodeURIComponent(info.videoId);
    });
  }

  function renderSessionLog() {
    const wrap = document.getElementById('sessionLogWrap');
    if (!wrap) return;
    const video = YTKC.getVideo(info.videoId);
    const recent = video.entries.slice(-5).reverse();
    if (recent.length === 0) {
      wrap.innerHTML = '';
      return;
    }
    wrap.innerHTML = '<div class="log" id="miniLog"></div>';
    const log = document.getElementById('miniLog');
    recent.forEach((e) => {
      const row = document.createElement('div');
      row.className = 'entry';
      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = YTKC.formatTime(e.t);
      const content = document.createElement('span');
      content.className = 'content';
      content.textContent = e.content;
      row.appendChild(ts);
      row.appendChild(content);
      log.appendChild(row);
    });
  }

  if (info) {
    renderMain();
  } else {
    renderManualFallback();
  }
</script>
</body>
</html>
