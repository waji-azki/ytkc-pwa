<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ログ | 配信感想メモ</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f0f0f">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="index.html">← 一覧</a>
    <h1>感想ログ</h1>
    <span></span>
  </header>
  <main id="main">
    <div class="empty">読み込み中...</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
  YTKC.registerSW();

  const params = new URLSearchParams(location.search);
  const videoId = params.get('id');
  const main = document.getElementById('main');

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1400);
  }

  function render() {
    const video = YTKC.getVideo(videoId);
    if (!video) {
      main.innerHTML = '<div class="empty">この動画の記録は見つかりませんでした。</div>';
      return;
    }
    const thumb = video.thumbnail || ('https://i.ytimg.com/vi/' + videoId + '/mqdefault.jpg');
    const titleText = video.title || videoId;

    main.innerHTML = `
      <div class="card">
        <div class="video-preview">
          <img src="${thumb}" alt="">
          <div class="title">${titleText}</div>
        </div>
      </div>

      <div class="watch-banner">
        <span>前回はここまで視聴: ${YTKC.formatTime(video.lastWatchedAt)}</span>
        <span style="display:flex; gap:10px;">
          <a href="watch.html?id=${encodeURIComponent(videoId)}">続きから計測</a>
          <a href="${YTKC.buildWatchUrl(videoId, video.lastWatchedAt)}" target="_blank" rel="noopener">YouTubeで開く</a>
        </span>
      </div>

      <div class="log" id="log"></div>

      <div class="time-row">
        再生時刻:
        <button class="stepBtn" id="timeMinus" type="button">-10s</button>
        <input id="timeInput" type="text" value="${YTKC.secondsToInputString(video.lastWatchedAt)}">
        <button class="stepBtn" id="timePlus" type="button">+10s</button>
        <span>(mm:ss)</span>
      </div>

      <div class="emoji-toggle-row">
        <button id="emojiToggleBtn" type="button">😊 絵文字</button>
      </div>
      <div class="emoji-picker" id="emojiPicker"></div>

      <div class="text-row">
        <input id="textInput" type="text" placeholder="感想を追記してEnter">
        <button id="sendBtn">送信</button>
      </div>

      <div class="actions-row">
        <button class="primary" id="exportBtn">送信用テキストを作成</button>
        <button id="deleteVideoBtn">この動画の記録を削除</button>
      </div>
      <a class="link-btn" href="import.html" style="display:block; margin-top:8px; text-decoration:none;">📥 友人の感想をインポート</a>

      <div id="exportWrap"></div>
    `;

    if (!video.title) {
      YTKC.fetchOEmbed(videoId).then((meta) => {
        if (meta) {
          YTKC.updateMeta(videoId, meta);
          main.querySelector('.video-preview .title').textContent = meta.title || videoId;
          if (meta.thumbnail) main.querySelector('.video-preview img').src = meta.thumbnail;
        }
      });
    }

    renderLog();

    function getCurrentT() {
      const raw = document.getElementById('timeInput').value.trim();
      const parts = raw.split(':').map((x) => parseInt(x, 10));
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        return parts[0] * 60 + parts[1];
      }
      const p = YTKC.parseTimeToken(raw);
      return p !== null ? p : video.lastWatchedAt;
    }
    function setCurrentT(sec) {
      document.getElementById('timeInput').value = YTKC.secondsToInputString(Math.max(0, sec));
    }
    document.getElementById('timeMinus').addEventListener('click', () => setCurrentT(getCurrentT() - 10));
    document.getElementById('timePlus').addEventListener('click', () => setCurrentT(getCurrentT() + 10));

    const emojiPicker = document.getElementById('emojiPicker');
    const emojiToggleBtn = document.getElementById('emojiToggleBtn');
    const textInput = document.getElementById('textInput');

    function insertAtCursor(input, text) {
      const start = input.selectionStart != null ? input.selectionStart : input.value.length;
      const end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
      input.value = input.value.slice(0, start) + text + input.value.slice(end);
      const pos = start + text.length;
      input.focus();
      input.setSelectionRange(pos, pos);
    }

    YTKC.EMOJIS.forEach((em) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = em;
      // タップしてもピッカーは閉じない = 連続して打てる
      b.addEventListener('click', () => insertAtCursor(textInput, em));
      emojiPicker.appendChild(b);
    });

    emojiToggleBtn.addEventListener('click', () => {
      const willShow = !emojiPicker.classList.contains('show');
      emojiPicker.classList.toggle('show', willShow);
      emojiToggleBtn.classList.toggle('active', willShow);
      if (willShow) textInput.focus();
    });

    document.getElementById('sendBtn').addEventListener('click', () => {
      const text = textInput.value.trim();
      if (!text) return;
      YTKC.addEntry(videoId, { t: getCurrentT(), type: 'text', content: text });
      render();
    });
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('sendBtn').click();
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const text = YTKC.buildExportText(YTKC.getVideo(videoId));
      const wrap = document.getElementById('exportWrap');
      wrap.innerHTML = `
        <div class="card">
          <textarea class="export-area" id="exportArea" readonly>${text}</textarea>
          <div class="actions-row">
            <button class="primary" id="copyBtn">コピー</button>
            <button id="shareBtn">共有</button>
          </div>
        </div>
      `;
      document.getElementById('copyBtn').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(text);
          showToast('コピーしました');
        } catch (e) {
          showToast('コピーに失敗しました');
        }
      });
      document.getElementById('shareBtn').addEventListener('click', async () => {
        if (navigator.share) {
          try {
            await navigator.share({ text });
          } catch (e) {}
        } else {
          showToast('この端末では共有機能が使えません');
        }
      });
    });

    document.getElementById('deleteVideoBtn').addEventListener('click', () => {
      if (confirm('この動画の記録をすべて削除します。よろしいですか?')) {
        YTKC.deleteVideo(videoId);
        location.href = 'index.html';
      }
    });
  }

  function renderLog() {
    const video = YTKC.getVideo(videoId);
    const log = document.getElementById('log');
    log.innerHTML = '';
    if (video.entries.length === 0) {
      log.innerHTML = '<div class="empty">まだコメントがありません。</div>';
      return;
    }
    video.entries.forEach((e) => {
      const row = document.createElement('div');
      row.className = 'entry';

      const ts = document.createElement('a');
      ts.className = 'ts';
      ts.textContent = YTKC.formatTime(e.t);
      ts.href = YTKC.buildWatchUrl(videoId, e.t);
      ts.target = '_blank';
      ts.rel = 'noopener';

      row.appendChild(ts);

      if (e.source) {
        const badge = document.createElement('span');
        badge.className = 'source-badge';
        badge.textContent = e.source;
        badge.style.color = YTKC.sourceColor(e.source);
        row.appendChild(badge);
      }

      const content = document.createElement('span');
      content.className = 'content';
      content.textContent = e.content;

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.addEventListener('click', () => {
        YTKC.deleteEntry(videoId, e.id);
        renderLog();
      });

      row.appendChild(content);
      row.appendChild(del);
      log.appendChild(row);
    });
  }

  if (!videoId) {
    main.innerHTML = '<div class="empty">動画が指定されていません。</div>';
  } else {
    render();
  }
</script>
</body>
</html>
